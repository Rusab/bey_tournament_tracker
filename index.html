<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Beyblade X Tournament</title>
    <meta name="description" content="Live groups, standings and knockout bracket for a Beyblade X tournament." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B0718" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS needs these to run full-screen from the home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BX Tournament" />
  </head>
  <body style="margin:0; background:#0B0718">
    <div id="root"></div>

    <!--
      If the app bundle fails to load, the page is blank and a spectator has no
      way to know a refresh would help. The usual cause is a stale cached page
      asking for a bundle a deploy has replaced, so clear the worker and its
      caches and reload — once, guarded, so a genuine outage cannot loop.
    -->
    <script>
      window.addEventListener("error", function (event) {
        var el = event.target;
        if (!el || el.tagName !== "SCRIPT" || !el.src) return;
        try {
          if (sessionStorage.getItem("bx:healed")) return;
          sessionStorage.setItem("bx:healed", "1");
        } catch (e) { return; }

        var done = function () { location.reload(); };
        var workers = navigator.serviceWorker
          ? navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            })
          : Promise.resolve();

        workers
          .then(function () { return window.caches ? caches.keys() : []; })
          .then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          })
          .then(done, done);
      }, true);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
